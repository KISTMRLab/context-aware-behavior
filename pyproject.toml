[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "context-aware-behavior"
version = "0.1.0"
description = "Joint BERT intent/entity model and grounded virtual-human dispatcher"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.2,<3", "transformers>=4.45,<6"]

[project.optional-dependencies]
speech = ["kokoro>=0.9,<1", "soundfile>=0.12,<1", "faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
context-behavior-train = "context_behavior.train:main"
context-behavior-infer = "context_behavior.infer:main"
context-behavior-data = "context_behavior.data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_behavior = ["resources/*.json", "resources/starter/*"]
