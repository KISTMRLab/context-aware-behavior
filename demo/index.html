<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Context-aware behavior room</title><style>body{margin:0;background:#101b26;color:#e6f1f2;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:25px}@media(max-width:700px){.grid{grid-template-columns:1fr}}#room{min-width:0;height:470px;border-radius:14px;overflow:hidden;background:#17273a}.object-list{display:flex;gap:8px;margin:10px 0}.object-list button{background:#395366;color:white}aside{background:#22313e;border-radius:14px;padding:18px}input,button{font:inherit;padding:11px;border-radius:8px}input{max-width:90%;width:300px}button{background:#60d5bf;border:0;cursor:pointer}pre{white-space:pre-wrap}</style><main><h1>Context to room behavior</h1><p>Inspect scene objects, then request an action. The server checks extracted entities, target existence, and affordances before the 3D room changes.</p><div class="grid"><section><div id="room"></div><div id="objects" class="object-list"></div><p><input id="utterance" value="Please open the drawer" aria-label="Utterance"><button id="send">Interpret and dispatch</button></p><p><label>Voice <select id="speech-backend"><option value="browser">Browser speech</option><option value="kokoro">Local Kokoro</option></select></label> <button id="record">Record utterance</button> <label>Audio file <input id="audio-file" type="file" accept="audio/*"></label></p><p id="speech-status" role="status"></p><p id="backend"></p></section><aside><h2>Scene inspection</h2><div id="inspect">Select an object.</div><h3>Interpretation</h3><pre id="result"></pre></aside></div></main><script type="module">import {createStage} from '/static/avatar.js?v=20261005-gesture7';import {Speech} from '/static/speech.js?v=20261005-gesture7';import {setupVoiceInput} from '/static/voice-input.js';const stage=createStage(document.querySelector('#room')),speech=new Speech(stage),inspect=document.querySelector('#inspect'),result=document.querySelector('#result');let scene,props={};const speechStatus=document.querySelector('#speech-status');const stopRecording=setupVoiceInput(speech,document.querySelector('#utterance'),document.querySelector('#record'),document.querySelector('#audio-file'),speechStatus);fetch('/api/speech').then(r=>r.json()).then(v=>{if(!v.asr)speechStatus.textContent='Local transcription requires WHISPER_MODEL_DIR; typed utterances work now.'});window.addEventListener('pagehide',()=>{stopRecording();speech.cancel();stage.dispose()});function draw(states){document.querySelector('#objects').replaceChildren();scene.objects.forEach(o=>{let button=document.createElement('button');button.textContent=o.id+' ('+states[o.id]+')';button.onclick=()=>inspect.textContent=o.id+' · supports '+(o.affordances.join(', ')||'no actions')+' · state '+states[o.id];document.querySelector('#objects').append(button);if(!props[o.id])props[o.id]=stage.addProp(o.id,(o.x-50)/16,(o.z-50)/20,o.color,[.6,.65,.6]);props[o.id].material.emissive.set(states[o.id]==='turn_on'?0xffcc66:0x000000);props[o.id].rotation.y=states[o.id]==='open'?.65:0});}fetch('/api/scene').then(r=>r.json()).then(v=>{scene=v.scene;draw(v.states);document.querySelector('#backend').textContent='Interpreter: '+v.backend});document.querySelector('#send').onclick=async()=>{let r=await fetch('/api/interpret',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#utterance').value})}),v=await r.json();result.textContent=JSON.stringify(v,null,2);if(v.states){draw(v.states);if(v.dispatch.command){let o=scene.objects.find(x=>x.id===v.dispatch.command.target);stage.moveTo((o.x-50)/16+.9,(o.z-50)/20-.2,1.2);stage.pointAt([(o.x-50)/16,.55,(o.z-50)/20]);speech.speak('I will '+v.dispatch.command.action.replaceAll('_',' ')+' the '+v.dispatch.command.target+'.',{backend:document.querySelector('#speech-backend').value}).catch(e=>speechStatus.textContent=e.message)}else if(v.dispatch.route==='conversation'){stage.gesture('explain');speech.speak('I am here in the room.',{backend:document.querySelector('#speech-backend').value}).catch(e=>speechStatus.textContent=e.message)}}};</script></html>
